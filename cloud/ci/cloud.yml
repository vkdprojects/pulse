name: cloud

on:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud.yml'
  pull_request:
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud.yml'

defaults:
  run:
    working-directory: cloud

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
