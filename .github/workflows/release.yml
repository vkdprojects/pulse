name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools protobuf-compiler
      - name: Build
        run: |
          cargo build --release -p pulse-agent --target x86_64-unknown-linux-musl
          cargo build --release -p pulse-master --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          mkdir -p dist-out
          cp target/x86_64-unknown-linux-musl/release/pulse-agent dist-out/pulse-agent-linux-x86_64
          cp target/x86_64-unknown-linux-musl/release/pulse-master dist-out/pulse-master-linux-x86_64
          ls -lh dist-out/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-x86_64
          path: dist-out/

  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-aarch64
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build with cross
        run: |
          cross build --release -p pulse-agent --target aarch64-unknown-linux-musl
          cross build --release -p pulse-master --target aarch64-unknown-linux-musl
      - name: Package
        run: |
          mkdir -p dist-out
          cp target/aarch64-unknown-linux-musl/release/pulse-agent dist-out/pulse-agent-linux-aarch64
          cp target/aarch64-unknown-linux-musl/release/pulse-master dist-out/pulse-master-linux-aarch64
          ls -lh dist-out/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-aarch64
          path: dist-out/

  release:
    needs: [build-x86, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
            dist/install-pulse.sh
