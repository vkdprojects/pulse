services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 2s
      timeout: 5s
      retries: 10

  gen-certs:
    build: .
    entrypoint: ["/usr/local/bin/pulse-master", "gen-certs", "/certs"]
    volumes:
      - certs:/certs

  master:
    build: .
    entrypoint: ["/usr/local/bin/pulse-master"]
    environment:
      PULSE_LISTEN: "0.0.0.0:50051"
      PULSE_TLS_DIR: /certs
      DATABASE_URL: "postgres://pulse:pulse@db:5432/pulse"
      RUST_LOG: info
    ports:
      - "50051:50051"
    volumes:
      - certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      gen-certs:
        condition: service_completed_successfully

  agent-1:
    build: .
    entrypoint: ["/usr/local/bin/pulse-agent", "/etc/pulse-agent.toml"]
    hostname: server-us-east-1
    volumes:
      - certs:/certs:ro
      - ./docker/agent.toml:/etc/pulse-agent.toml:ro
    depends_on:
      master:
        condition: service_started
    restart: on-failure

  agent-2:
    build: .
    entrypoint: ["/usr/local/bin/pulse-agent", "/etc/pulse-agent.toml"]
    hostname: server-eu-west-1
    volumes:
      - certs:/certs:ro
      - ./docker/agent.toml:/etc/pulse-agent.toml:ro
    depends_on:
      master:
        condition: service_started
    restart: on-failure

  agent-3:
    build: .
    entrypoint: ["/usr/local/bin/pulse-agent", "/etc/pulse-agent.toml"]
    hostname: server-sa-east-1
    volumes:
      - certs:/certs:ro
      - ./docker/agent.toml:/etc/pulse-agent.toml:ro
    depends_on:
      master:
        condition: service_started
    restart: on-failure

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: pulse
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/pulse.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  certs:
  pgdata:
